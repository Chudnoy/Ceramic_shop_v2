<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Полина Яланская{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='public/css/site.css') }}"
    >

    {% block styles %}{% endblock %}
</head>

<body>
    <header class="site-header" data-nav>
        <a
            class="site-header__brand"
            href="{{ url_for('public.home') }}"
        >
            Полина Яланская
        </a>

        <button
            class="site-header__toggle"
            type="button"
            aria-expanded="false"
            aria-controls="site-navigation"
        >
            <span>Меню</span>

            <span
                class="site-header__toggle-icon"
                aria-hidden="true"
            >
                +
            </span>
        </button>

        <nav
            class="site-header__nav"
            id="site-navigation"
            aria-label="Основная навигация"
        >
            <a href="{{ url_for('public.home') }}#projects">Проекты</a>
            <a href="{{ url_for('public.home') }}#works">Работы</a>
            <a href="{{ url_for('public.home') }}#shop">Магазин</a>
            <a href="{{ url_for('public.home') }}#about">О мастерской</a>
            <a href="{{ url_for('public.home') }}#contacts">Контакты</a>
        </nav>
    </header>

    {% block content %}{% endblock %}

    <script
        src="{{ url_for('static', filename='public/js/site.js') }}"
    ></script>
</body>
</html>
