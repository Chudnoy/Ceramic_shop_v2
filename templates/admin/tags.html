{% extends 'admin/base.html' %}

{% block content %}
	<h1 class="admin-page-title">Теги</h1>
	<div class="admin-actions">
    <a href="{{ url_for('admin.new_tag_route') }}" class="admin-button">
        Добавить тег
    </a>
</div>

	<div class="admin-table-wrapper">
		<table class="admin-table">
			<thead>
				<tr>
					<th>Тег</th>
					<th>Slug</th>
					<th>Количество работ</th>
					<th>Действия</th>
				</tr>
			</thead>
			<tbody>
				{% for tag in tags %}
				<tr>
					<td data-label="Тег"><strong>{{ tag.name }}</strong></td>
					<td data-label="Slug"><code class="admin-slug">{{ tag.slug }}</code></td>
					<td data-label="Количество работ">{{ tag.products_count }}</td>
					<td data-label="Действия">
						<div class="admin-row-actions">
						<a href="{{ url_for('admin.tag_details', tag_slug=tag.slug) }}">Подробнее</a>
						<form action="{{ url_for('admin.delete_tag_route', tag_id=tag.id) }}" method="post" class="admin-inline-form" onsubmit="return confirm('Удалить тег?')">
							<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
							<button type="submit" class="admin-link-button admin-link-button-danger">Удалить</button>
						</form>
						</div>
					</td>
				</tr>
				{% endfor %}
			</tbody>
		</table>
	</div>
{% endblock %}
