{% extends 'admin/base.html' %}

{% block content %}
<h1 class="admin-page-title">{{ title }}</h1>

<form method="post" enctype="multipart/form-data" class="admin-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="admin-form-group">
        <label for="name">Название</label>
        <input type="text" name="name" id="name" value="{{ product.name }}">
    </div>

    <div class="admin-form-group">
        <label for="description">Описание</label>
        <textarea name="description" id="description" rows="4">{{ product.description }}</textarea>
    </div>
    
    <div class="admin-form-group">
        <label for="materials">Материалы</label>
        <input type="text" name="materials" id="materials" value="{{ product.materials }}">
    </div>
    
    <div class="admin-form-group">
        <label for="year">Год изготовления</label>
        <input type="number" name="year" id="year" value="{{ product.year }}">
    </div>

    <div class="admin-form-group">
        <label for="price">Цена</label>
        <input type="number" name="price" id="price" value="{{ product.price }}">
    </div>

    <div class="admin-form-group">
        <label for="img">Изображение</label>

        {% if product.img %}
            <div class="admin-current-image">
                <img src="{{ product.img }}" alt="{{ product.name }}" class="admin-product-preview">
                <span class="admin-muted">Текущее изображение</span>
            </div>
        {% endif %}

        <input type="file" name="img" id="img">
    </div>

    <div class="admin-form-group">
        <label for="category_id">Категория</label>
        <select name="category_id" id="category_id">
            {% for category in categories %}
                <option value="{{ category.id }}"
                    {% if product.category_id == category.id %}selected{% endif %}>
                    {{ category.name }}
                </option>
            {% endfor %}
        </select>
    </div>
    
    <div class="admin-form-group">
        <label>Теги</label>
        <div class="admin-checkbox-list">
            {% for tag in tags %}
                <div class="admin-checkbox-group">
                    <input type="checkbox" 
                    name="tag_ids" 
                    id="tag_{{ tag.id }}"
                    value="{{ tag.id }}"
                    {% if tag.id in selected_tag_ids %}checked{% endif %}
                    >
                    <label for="tag_{{ tag.id }}">{{tag.name}}</label>
                </div>
            {% endfor %}
        </div>
    </div>
    
    <div class="admin-form-group">
        <label for="status">Статус товара</label>
        <select name="status" id="status" class="form-control" required>
            {% for status_key, status_label in product_statuses.items() %}
                <option value="{{ status_key }}" {% if product['status'] == status_key %}selected{% endif %}>
                    {{ status_label }}
                </option>
            {% endfor %}
        </select>
    </div>

	<div class="admin-form-group admin-checkbox-group">
		<input type="checkbox" name="is_visible" id="is_visible" value="1" {% if product.is_visible %}checked{% endif %}>
		<label for="is_visible">Доступен на сайте</label>
	</div>

	<div class="admin-form-group admin-checkbox-group">
		<input type="checkbox" name="is_for_sale" id="is_for_sale" value="1" {% if product.is_for_sale %}checked{% endif %}>
		<label for="is_for_sale">Для продажи</label>
	</div>

    <button type="submit" class="admin-button">{{ submit_text }}</button>
</form>
{% endblock %}
